name: Publish Render image

on:
  push:
    branches: [render-deploy]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build Linux image
        run: docker build --platform linux/amd64 --label org.opencontainers.image.source=https://github.com/mohamedrafatfcih/PyQuran-API --tag ghcr.io/mohamedrafatfcih/pyquran-api-render:v1 .
      - name: Check the API in the container
        run: |
          docker run --detach --rm --publish 127.0.0.1:8000:8000 --name pyquran ghcr.io/mohamedrafatfcih/pyquran-api-render:v1
          trap 'docker logs pyquran; docker stop pyquran' EXIT
          curl --fail --silent --show-error --retry 10 --retry-all-errors --retry-delay 1 --retry-max-time 30 'http://127.0.0.1:8000/suras/verse?sura_number=1&verse_number=1' |
            python3 -c 'import json, sys; verse = json.load(sys.stdin); assert verse["number"] == 1 and "بسم" in verse["content"]'
      - name: Publish to GitHub Container Registry
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push ghcr.io/mohamedrafatfcih/pyquran-api-render:v1
